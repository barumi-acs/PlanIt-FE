name: Deploy Frontend to S3 + CloudFront

on:
  push:
    branches:
      - develop

env:
  SERVICE_NAME: planit-fe

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v4

      - name: Node 설치
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: pnpm 설치
        run: npm install -g pnpm

      - name: dependencies 설치
        run: pnpm install

      # 🚨 팩트: JSON 시크릿을 .env 파일로 변환 (빌드 전 필수!)
      - name: Write .env from JSON secret
        run: |
          echo '${{ secrets.VITE_APP_ENVS_JSON }}' | jq -r 'to_entries | map("\(.key)=\(.value)") | .[]' > .env

      # 빌드 (이제 생성된 .env를 참조함)
      - name: build
        run: pnpm build
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: AWS 인증
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: S3 업로드
        run: |
          aws s3 sync dist/ s3://${{ secrets.S3_BUCKET_FE }} --delete

      - name: CloudFront 캐시 무효화
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"
      

      # 🔥 실패 알림
      - name: 🔥 Notify FE Deploy Failure
        if: always() && failure()
        run: |
          aws sns publish \
            --region ${{ env.AWS_REGION }} \
            --topic-arn ${{ secrets.SNS_TOPIC_ARN }} \
            --message '{
              "type": "CD",
              "workflow": "${{ github.workflow }}",
              "service": "'$SERVICE_NAME'",
              "env": "dev",
              "stage": "fe-deploy",
              "status": "FAILED",
              "message": "${{ github.event.head_commit.message }}",
              "author": "${{ github.actor }}",
              "url": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }'

        # 🚀 성공 알림
      - name: 🚀 Notify CD Success
        if: success()
        run: |
          aws sns publish \
            --region ${{ env.AWS_REGION }} \
            --topic-arn ${{ secrets.SNS_TOPIC_ARN }} \
            --message '{
              "type": "CD",
              "workflow": "${{ github.workflow }}",
              "service": "'$SERVICE_NAME'",
              "env": "dev",
              "stage": "fe-deploy",
              "status": "SUCCESS",
              "message": "${{ github.event.head_commit.message }}",
              "author": "${{ github.actor }}",
              "url": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }'